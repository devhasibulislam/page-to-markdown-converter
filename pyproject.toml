[project]
name = "page-to-markdown-converter"
version = "0.1.0"
description = "Turn any web page into clean Markdown via a browser extension + Python backend."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "trafilatura>=1.12",
    "readability-lxml>=0.8",
    "markdownify>=0.13",
    "python-frontmatter>=1.1",
    "markdown>=3.7",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
