<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}MarkDrop — Turn any page into clean Markdown{% endblock
      %}
    </title>
    <meta
      name="description"
      content="{% block description %}A browser extension and API that converts any web page into clean Markdown. Works on SPAs, logged-in pages, and paywalled content.{% endblock %}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/site.css') }}"
    />
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <nav class="nav">
      <div class="nav-inner">
        <a class="brand" href="/">MarkDrop</a>
        <div class="nav-links">
          <a class="nav-link" href="/blog">Blog</a>
          <a class="nav-link" href="/docs">API</a>
          <a
            class="nav-link hidden-mobile"
            href="https://github.com/devhasibulislam/page-to-markdown-converter"
            >GitHub</a
          >
          <a class="btn small" href="/download/extension.zip"
            >Get the extension</a
          >
        </div>
      </div>
    </nav>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <div>© 2026 MarkDrop. MIT licensed.</div>
        <div>
          <a href="/legal/privacy">Privacy</a>
          <a href="/legal/terms">Terms</a>
          <a href="/legal/cookies">Cookies</a>
          <a
            href="https://github.com/devhasibulislam/page-to-markdown-converter"
            >Source</a
          >
        </div>
      </div>
    </footer>

    {% block scripts %}{% endblock %}
  </body>
</html>
