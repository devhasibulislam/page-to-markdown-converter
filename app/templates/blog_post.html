{% extends "base.html" %} {% block title %}{{ post.title }} — MarkDrop{%
endblock %} {% block content %}
<article class="py-5">
  <div class="container" style="max-width: 720px">
    <a href="/blog" class="text-decoration-none small text-muted"
      >← All posts</a
    >
    <h1 class="fw-bold mt-3">{{ post.title }}</h1>
    <div class="small text-muted mb-4">
      {{ post.date }} · {{ post.author }} {% for tag in post.tags %}<span
        class="badge text-bg-light border ms-1"
        >{{ tag }}</span
      >{% endfor %}
    </div>
    <div class="post-body">{{ post.html | safe }}</div>
  </div>
</article>
{% endblock %}
